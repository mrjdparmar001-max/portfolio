name: Keep Render Awake

on:
  schedule:
    # Ping every 10 minutes — Render free tier sleeps after ~15 min idle
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            "https://portfolio-w9xn.onrender.com/api/health"
